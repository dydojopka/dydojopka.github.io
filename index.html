<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101815" />
    <meta name="description" content="Евгений Ашроев — студент ИМИТ ИГУ. Python, терминальные приложения, веб-интерфейсы и проекты в интерактивной 3D-визитке." />
    <title>Evgeny Ashroev</title>
    <script>
      document.documentElement.dataset.mode = new URL(location.href).searchParams.get('view') === 'card' ? 'card' : 'loading';
      document.documentElement.dataset.cardTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'paper';
      window.addEventListener('error', (event) => {
        if (event.target?.tagName !== 'SCRIPT' || event.target.type !== 'module') return;
        document.documentElement.dataset.mode = 'card';
        document.documentElement.dataset.cardTheme = 'dark';
      }, true);
    </script>
    <link rel="stylesheet" href="/src/business-card.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23101815'/%3E%3Crect x='10' y='12' width='44' height='34' rx='3' fill='%236b8873'/%3E%3Crect x='15' y='17' width='34' height='23' rx='3' fill='%23283f32'/%3E%3Cpath d='M23 52h18' stroke='%236b8873' stroke-width='5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="scene-loading" role="status" aria-live="polite">Загрузка рабочего стола…</div>
    <section id="room" hidden inert tabindex="0" aria-describedby="view-help" aria-label="Трёхмерная сцена: рабочий стол с ЭЛТ-монитором, клавиатурой, принтером, растением и лампой в ночной комнате. За окном сильная метель.">
      <div class="view-controls" hidden>
        <p id="view-help"></p>
      </div>
      <div class="monitor-controls" hidden>
        <p>Прокрутка — колесо / свайп · Назад — Esc / Home</p>
        <button id="leave-monitor" class="mobile-return" type="button">К столу</button>
      </div>
      <div class="printer-controls" hidden>
        <p>Управление — нажатие / Enter · Назад — Esc / Home</p>
        <p id="printer-status" class="screen-access" role="status"></p>
        <button id="leave-printer" class="mobile-return" type="button">К столу</button>
      </div>
    </section>
    <main id="card">
      <div class="card-service">
        <p id="card-notice" role="status">У сайта есть интерактивная 3D-сцена. Сейчас она недоступна — показана текстовая визитка.</p>
        <button id="card-return" type="button" hidden>К 3D-визитке</button>
        <button id="card-theme" type="button" hidden aria-label="Включить светлый лист" title="Включить светлый лист">
          <svg class="theme-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
          </svg>
          <svg class="theme-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z" />
          </svg>
        </button>
      </div>
      <!-- BUSINESS_CARD -->
    </main>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
